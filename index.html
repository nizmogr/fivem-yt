
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: transparent !important;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  #panel {
    display: none;
    position: fixed;
    top: 20px;
    right: 20px;
    width: 244px;
    padding: 12px;
    background: #171c25;
    border: 1px solid #343c49;
    border-radius: 12px;
    color: white;
    text-align: center;
    box-shadow: 0 8px 25px #0008;
  }

  #title {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  #holder, #ytplayer {
    width: 220px;
    height: 220px;
  }

  #status {
    font-size: 11px;
    color: #b8c1ce;
    margin: 10px 0;
  }

  #play {
    display: none;
    background: #3279e7;
    color: white;
  }

  button {
    border: 0;
    padding: 9px 12px;
    border-radius: 6px;
    cursor: pointer;
    margin: 2px;
  }
</style>
</head>

<body>
<div id="panel">
  <div id="title">Fake Sound — YouTube</div>
  <div id="holder"></div>
  <div id="status">Loading...</div>

  <button id="play">Play Sound</button>
  <button id="close">Close</button>
</div>

<script>
let player = null;
let apiReady = false;
let pending = null;
let hasFocus = false;
let session = 0;
let fallbackTimer = null;

const panel = document.getElementById("panel");
const holder = document.getElementById("holder");
const status = document.getElementById("status");
const playButton = document.getElementById("play");

async function setGameFocus(focus) {
  if (typeof GetParentResourceName !== "function") return;

  if (hasFocus === focus) return;
  hasFocus = focus;

  try {
    await fetch(
      `https://${GetParentResourceName()}/fakeSoundFocus`,
      {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({focus: focus})
      }
    );
  } catch (e) {
    console.warn("NUI focus request failed:", e);
  }
}

function showPlayButton() {
  if (panel.style.display === "none") return;
  playButton.style.display = "inline-block";
  status.textContent = "Press Play to hear the sound";
  setGameFocus(true);
}

function closePlayer() {
  session++;

  if (fallbackTimer) {
    clearTimeout(fallbackTimer);
    fallbackTimer = null;
  }

  if (player) {
    player.destroy();
    player = null;
  }

  holder.innerHTML = "";
  panel.style.display = "none";
  playButton.style.display = "none";
  setGameFocus(false);
}

function openVideo(video, volume) {
  if (!/^[a-zA-Z0-9_-]{11}$/.test(video)) return;

  session++;
  const currentSession = session;

  if (fallbackTimer) clearTimeout(fallbackTimer);

  panel.style.display = "block";
  playButton.style.display = "none";
  status.textContent = "Loading YouTube...";

  if (!apiReady) {
    pending = {video, volume};
    return;
  }

  if (player) {
    player.destroy();
    player = null;
  }

  holder.innerHTML = '<div id="ytplayer"></div>';

  player = new YT.Player("ytplayer", {
    width: 220,
    height: 220,
    videoId: video,
    playerVars: {
      autoplay: 1,
      controls: 1,
      playsinline: 1,
      origin: location.origin
    },
    events: {
      onReady: function(event) {
        if (currentSession !== session) return;

        event.target.setVolume(
          Math.max(0, Math.min(Number(volume) || 50, 100))
        );

        event.target.unMute();
        event.target.playVideo();

        status.textContent = "Starting...";

        fallbackTimer = setTimeout(function() {
          if (currentSession !== session) return;

          if (
            player &&
            player.getPlayerState() !== YT.PlayerState.PLAYING
          ) {
            showPlayButton();
          }
        }, 4500);
      },

      onStateChange: function(event) {
        if (currentSession !== session) return;

        if (event.data === YT.PlayerState.PLAYING) {
          status.textContent = "PLAYING";
          playButton.style.display = "none";
          setGameFocus(false);
        }

        if (event.data === YT.PlayerState.ENDED) {
          closePlayer();
        }
      },

      onAutoplayBlocked: function() {
        if (currentSession !== session) return;
        showPlayButton();
      },

      onError: function(event) {
        if (currentSession !== session) return;
        status.textContent = "YouTube error: " + event.data;
        playButton.style.display = "none";
        setGameFocus(true);
      }
    }
  });
}

window.onYouTubeIframeAPIReady = function() {
  apiReady = true;

  if (pending) {
    const data = pending;
    pending = null;
    openVideo(data.video, data.volume);
  }
};

window.addEventListener("message", function(event) {
  const data = event.data;

  if (data && data.type === "playFakeSound") {
    openVideo(data.video, data.volume);
  }
});

playButton.onclick = function() {
  if (!player) return;

  player.unMute();
  player.playVideo();
};

document.getElementById("close").onclick = closePlayer;

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") closePlayer();
});

// Allows testing directly in a browser.
const params = new URLSearchParams(location.search);

if (params.has("video")) {
  openVideo(
    params.get("video"),
    Number(params.get("volume")) || 50
  );
}
</script>

<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
